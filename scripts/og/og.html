<!DOCTYPE html>
<!-- Source for assets/img/og.png (the picture shown when the site is shared).
     To regenerate:  npm run og  -->
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Segoe UI",Inter,Arial,sans-serif;color:#fff;position:relative;
  background:linear-gradient(135deg,#312e81 0%,#4f46e5 45%,#7c3aed 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:520px;height:520px;background:#f97316;opacity:.55;top:-200px;right:-120px}
.b2{width:420px;height:420px;background:#22d3ee;opacity:.3;bottom:-220px;left:-100px}
.wrap{position:relative;padding:70px 80px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:22px;font-size:58px;font-weight:800;letter-spacing:-1.5px}
.mark{width:84px;height:84px;border-radius:24px;background:#fff;color:#4f46e5;display:grid;place-items:center;font-size:52px;font-weight:900}
.logo b{color:#facc15}
h1{font-size:64px;line-height:1.08;letter-spacing:-2px;margin-top:46px;max-width:760px}
h1 span{color:#facc15}
.chips{display:flex;gap:14px;margin-top:34px}
.chips{max-width:640px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 18px;font-size:23px;font-weight:600}
.foot{margin-top:auto;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;opacity:.95}
.dot{width:16px;height:16px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 6px rgba(74,222,128,.3)}
.cards{position:absolute;right:60px;top:120px;display:grid;gap:18px;transform:rotate(-4deg)}
.card{width:330px;background:#fff;color:#141824;border-radius:22px;padding:20px 22px;box-shadow:0 30px 60px rgba(15,10,60,.4)}
.card small{display:block;color:#5e6678;font-size:17px;font-weight:600}
.card strong{display:block;font-size:22px;line-height:1.25;margin:6px 0 10px}
.pill{display:inline-block;font-size:16px;font-weight:700;padding:4px 12px;border-radius:999px}
.ok{background:#e5f6ef;color:#047857}.soon{background:#fff4e0;color:#b45309}
.c2{margin-left:40px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <div class="logo"><span class="mark">F</span><span>Fursa<b>Hub</b></span></div>
  <h1>Your next <span>opportunity</span><br>starts here.</h1>
  <div class="chips"><span class="chip">💼 Jobs</span><span class="chip">🎓 Scholarships</span><span class="chip">🚀 Internships</span><span class="chip">💰 Grants</span></div>
  <div class="foot"><i class="dot"></i> Updated every day · Free · Never pay to apply</div>
</div>
<div class="cards">
  <div class="card"><small>🎓 Scholarship · United Kingdom</small><strong>Fully funded Master's</strong><span class="pill soon">● Closing soon</span></div>
  <div class="card c2"><small>💼 Job · Remote</small><strong>Work from anywhere</strong><span class="pill ok">● Open</span></div>
</div>
</body></html>
