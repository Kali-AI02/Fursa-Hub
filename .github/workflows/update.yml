# Builds and publishes FursaHub on GitHub Pages.
# Runs automatically twice a day (new listings in, closed listings out),
# every time you push a change, and whenever you click "Run workflow"
# in the Actions tab.
name: Update & deploy

on:
  schedule:
    - cron: '0 3,15 * * *'   # 03:00 and 15:00 UTC (Remotive allows max 4 fetches a day)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the previous listings so that, if a source is down, its
      # listings are not lost (fetch.mjs falls back to them).
      - name: Restore previous listings
        uses: actions/cache/restore@v4
        with:
          path: data/opportunities.json
          key: listings-${{ github.run_id }}
          restore-keys: listings-

      - name: Fetch opportunities and build site
        run: npm run update
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}

      - name: Save listings for next run
        uses: actions/cache/save@v4
        with:
          path: data/opportunities.json
          key: listings-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
